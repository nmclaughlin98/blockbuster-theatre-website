<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Blockbuster Theatres - the ultimate modern cinema experience." />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=chevron_left,chevron_right,download,location_on,send,clock_loader_20,home,search,warning" />
    <title>Blockbuster Theatre</title>
    <script>
        // Single Page Apps for GitHub Pages
        // https://github.com/rafgraph/spa-github-pages
        // Restores the path/query that public/404.html encoded, so
        // window.location matches the originally requested URL before the
        // React app (and its router) reads it.
        (function (l) {
            if (l.search[1] === 'p') {
                var decoded = l.search.slice(1).split('&').map(function (segment) {
                    return segment.replace(/~and~/g, '&');
                });
                var params = {};
                decoded.forEach(function (pair) {
                    var index = pair.indexOf('=');
                    params[pair.slice(0, index)] = pair.slice(index + 1);
                });
                window.history.replaceState(
                    null,
                    null,
                    l.pathname.slice(0, -1) + (params.p || '') +
                    (params.q ? ('?' + params.q) : '') +
                    l.hash
                );
            }
        })(window.location);
    </script>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
</body>

</html>
