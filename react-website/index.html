    <script>
        // Single Page Apps for GitHub Pages
        // https://github.com/rafgraph/spa-github-pages
        // Restores the path/query that public/404.html encoded, so
        // window.location matches the originally requested URL before the
        // React app (and its router) reads it.
        (function (l) {
            if (l.search[1] === 'p') {
                var decoded = l.search.slice(1).split('&').map(function (segment) {
                    return segment.replace(/~and~/g, '&');
                });
                var params = {};
                decoded.forEach(function (pair) {
                    var index = pair.indexOf('=');
                    params[pair.slice(0, index)] = pair.slice(index + 1);
                });
                window.history.replaceState(
                    null,
                    null,
                    l.pathname.slice(0, -1) + (params.p || '') +
                    (params.q ? ('?' + params.q) : '') +
                    l.hash
                );
            }
        })(window.location);
    </script>
    <script>
        if (!/booknow|collections\.html|collection\.html|movie-detail|nowshowing|comingsoon|timetable|about/i.test(window.location.pathname)) {

    </script>
